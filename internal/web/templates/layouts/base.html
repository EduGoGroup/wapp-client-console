<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wApp · {{ .Title }}</title>

    <link rel="stylesheet" href="/static/css/wapp-tokens.css">
    <link rel="stylesheet" href="/static/css/wapp-components.css">
    <link rel="stylesheet" href="/static/css/theme-bff.css">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

    <header class="app-bar">
        <a href="/" class="app-bar__brand">
            <span class="app-bar__logo" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">{{ template "brand_mark" }}</svg>
            </span>
            <span class="app-bar__titles">
                <span class="app-bar__name">wApp</span>
                <span class="app-bar__sub">{{ .Subtitle }}</span>
            </span>
        </a>
        {{ if .IsAuthenticated }}
        <nav class="app-bar__actions">
            <form method="POST" action="/logout" class="app-bar__logout-form">
                <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
                <button type="submit" class="btn btn--text">Cerrar sesión</button>
            </form>
        </nav>
        {{ end }}
    </header>

    <main class="app-main">
        {{ yield .ContentTemplate . }}
    </main>

</body>
</html>
